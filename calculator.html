<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="cal.css">
    <script src="ca.js" defer></script>

<body>
    <header><h1>Hello! Welcome to my webpage</h1></header>

<section>
  <div id="wish">
    <h2>Hello</h2>
  </div>

  <h3>Click Button to Change Color</h3>
  <div class="btn-area">
    <button id="colorBtn">Change Color</button><hr>
  </div>

  <div class="card">
    <h3>Calculator</h3>
    <input type="number" id="num1" placeholder="First">
    <input type="number" id="num2" placeholder="Second"><br>

    <button class="calc" id="btnAdd">Add</button>
    <button class="calc" id="btnSub">Subtract</button>
    <button class="calc" id="btnMul">Multiply</button>
    <button class="calc" id="btnDiv">Divide</button>

    <div id="result"></div>
  </div>
</section>
